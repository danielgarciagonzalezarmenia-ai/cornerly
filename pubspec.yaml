name: cornerly
description: "Cornerly - Analiza. Filtra. Gana corners. App local de análisis de apuestas de corners de fútbol."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2+1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  cached_network_image: ^3.4.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#007AFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
